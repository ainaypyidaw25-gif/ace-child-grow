apply plugin: 'com.android.application'

def aceReleaseSourceCommit = System.getenv("ACE_ANDROID_SOURCE_COMMIT") ?: "development"
def aceReleasePlayMaxVersionCode = System.getenv("ACE_ANDROID_PLAY_MAX_VERSION_CODE")

android {
    namespace = "mm.com.acegroup.acechildgrow"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "mm.com.acegroup.acechildgrow"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14
        versionName "1.13"
        manifestPlaceholders = [aceSourceCommit: aceReleaseSourceCommit]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def uploadStoreFile = System.getenv("ACE_ANDROID_UPLOAD_STORE_FILE")
            def uploadStorePassword = System.getenv("ACE_ANDROID_UPLOAD_STORE_PASSWORD")
            def uploadKeyAlias = System.getenv("ACE_ANDROID_UPLOAD_KEY_ALIAS")
            def uploadKeyPassword = System.getenv("ACE_ANDROID_UPLOAD_KEY_PASSWORD")
            if (uploadStoreFile && uploadStorePassword && uploadKeyAlias && uploadKeyPassword) {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("ACE_ANDROID_UPLOAD_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releasePackagingRequested = graph.allTasks.any { task ->
        def name = task.name.toLowerCase()
        name.contains("release") && (name.contains("bundle") || name.contains("assemble") || name.contains("package"))
    }
    if (releasePackagingRequested) {
        def repositoryRoot = rootProject.projectDir.parentFile
        def sourceGate = new File(repositoryRoot, "scripts/check-android-release-source.mjs")
        if (!sourceGate.isFile()) {
            throw new GradleException("Android release source preflight script is missing")
        }

        try {
            def processBuilder = new ProcessBuilder("node", sourceGate.absolutePath)
                .directory(repositoryRoot)
                .redirectErrorStream(true)
            processBuilder.environment().put("ACE_ANDROID_SOURCE_COMMIT", aceReleaseSourceCommit)
            if (aceReleasePlayMaxVersionCode == null) {
                processBuilder.environment().remove("ACE_ANDROID_PLAY_MAX_VERSION_CODE")
            } else {
                processBuilder.environment().put("ACE_ANDROID_PLAY_MAX_VERSION_CODE", aceReleasePlayMaxVersionCode)
            }
            def process = processBuilder.start()
            process.inputStream.eachLine { line -> logger.lifecycle(line) }
            if (process.waitFor() != 0) {
                throw new GradleException("Android release source preflight failed")
            }
        } catch (IOException error) {
            throw new GradleException("Android release source preflight could not run", error)
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
