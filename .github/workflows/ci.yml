name: CI

# Runs the checks that were previously only run by hand, so a pull request
# carries its own evidence instead of a claim in a description.
#
# Deliberately NOT in this workflow: anything that touches a deployment.
# No Convex deploy, no Vercel deploy, no seeding, no migration, no publication.
# CI here proves the code is sound; releasing stays a human action.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref. Saves runner time
# and stops a stale red/green from landing after a newer commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The repo pins Chromium separately for E2E; nothing else should pull browsers.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  # Static checks and unit tests. Fast, and the first thing a reviewer wants.
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build and test tools execute repository inputs during CI, so high or
      # critical advisories in either runtime or development packages block it.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs before the build on purpose: some suites read the built bundle
      # when it exists (noDevRoutes asserts no harness marker in dist/), and a
      # stale dist/ from a previous step would make that check meaningless.
      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # Generic application builds must be reproducible and must never refresh
      # the separately approved social-publication queue as a side effect.
      - name: Assert production build leaves tracked sources unchanged
        run: git diff --exit-code

      # The layout harness is a separate bundle that must never reach the app.
      # Building it here proves it still compiles on its own config.
      - name: Layout harness build
        run: npm run build:harness

      - name: Verify parent-only free Google Play bundle
        run: npm run build:play-store:verify

      # Re-run the bundle assertions against a real dist/: no dev route and no
      # harness marker in anything shipped.
      - name: Assert no dev route in the built bundle
        run: npx vitest run src/domain/__tests__/noDevRoutes.test.ts

      - name: Whitespace and conflict markers
        run: git diff --check

  # Browser checks. The whole Playwright suite runs; specs that need a live
  # Convex connection gate themselves behind E2E_LIVE and skip here, so CI
  # never depends on production data or credentials.
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The hosted runner already carries Chromium's system libraries. Install
      # only the pinned browser binary so an unavailable apt mirror cannot
      # prevent the actual browser suite from starting.
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'

      # The WHOLE suite runs. Specs needing Convex egress gate themselves behind
      # E2E_LIVE and report as skipped, which is honest: an omitted spec is
      # invisible, a skipped one is on the record with its reason. Set
      # E2E_LIVE=1 (with a reachable deployment) to run them for real.
      - name: Run Playwright suite (live specs skip without E2E_LIVE)
        run: npx playwright test

      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
